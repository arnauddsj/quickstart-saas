# docs/deployment.md
# Overlay: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
# Kept separate because Compose interpolates ${VAR:?} for every service, even ones a
# profile would skip, so required production secrets would block `docker compose up` in dev.
name: quickstart

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-quickstart}@postgres/${POSTGRES_DB:-quickstart}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env (the origin browsers use)}
      CORS_ORIGINS: ${PUBLIC_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (32+ chars)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      LOOPS_API_KEY: ${LOOPS_API_KEY:-}
      LOOPS_TEMPLATE_IDS: ${LOOPS_TEMPLATE_IDS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in .env}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-price_pro_monthly_placeholder}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SOURCE_COMMIT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    stop_grace_period: 10s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        VITE_GLITCHTIP_URL: ${VITE_GLITCHTIP_URL:-}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        SENTRY_URL: ${SENTRY_URL:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      secrets:
        - SENTRY_AUTH_TOKEN
    ports:
      - '${CLIENT_PORT:-80}:80'
    environment:
      API_UPSTREAM: server:3000
      GLITCHTIP_ORIGIN: ${GLITCHTIP_ORIGIN:-}
    depends_on:
      server:
        condition: service_healthy

secrets:
  SENTRY_AUTH_TOKEN:
    environment: SENTRY_AUTH_TOKEN
